# Render Blueprint — Phase 1: API + Postgres. Phase 9 voegt een Key Value
# (Redis)-instance en een aparte achtergrondwerker-service toe voor de
# Teamleader-sync (BullMQ, sectie 15), zoals aangekondigd in de Phase 1/8-
# commentaren hierboven. De PDF-generatie zelf (Phase 8) draait bewust nog
# steeds synchroon in de API zelf (geen queue nodig, zie work-order-pdf.service.ts).
#
# LET OP — huidige keuze: `plan: free` overal, bewust voor de testfase.
# De gratis Postgres-database wordt door Render automatisch verwijderd na
# 30 dagen, de gratis web/worker-services vallen na inactiviteit in slaap
# (trage cold-start bij de eerstvolgende request/job), en een gratis Key
# Value-instance heeft eigen beperkingen (zie render.com/docs/key-value) —
# controleer dit zeker in het Render-dashboard vóór Phase 9 op echte
# klantwerkbonnen draait: een "in slaap gevallen" worker verwerkt geen
# syncjobs tot de eerstvolgende keer dat hij wakker wordt. Prima om nu te
# ontwikkelen en te testen, maar VOOR er echte klantwerkbonnen op komen te
# staan moet dit naar betaalde plans om dataverlies, cold-starts en gemiste
# sync-runs te vermijden.
databases:
  - name: swatt-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: '16'

services:
  # Phase 9 — Redis/Valkey voor de BullMQ-syncqueue (sectie 15). `keyvalue`
  # is Render's huidige typenaam (vroeger "redis"); `ipAllowList` is verplicht
  # — enkel de eigen Render-services (web + worker hieronder) mogen erbij, dus
  # geen publiek toegankelijk adres nodig.
  - type: keyvalue
    name: swatt-redis
    plan: free
    region: frankfurt
    # Leeg = geen publieke toegang; enkel services binnen dit Render-account/
    # dezelfde regio bereiken deze instance via het interne netwerk
    # (REDIS_URL hieronder, via fromService/connectionString). Niet live
    # geverifieerd in het Render-dashboard — controleer dit bij de eerste
    # deploy en vul zo nodig `source: 0.0.0.0/0` in als verbinden niet lukt.
    ipAllowList: []
  - type: web
    name: swatt-api
    runtime: node
    plan: free
    region: frankfurt
    # Geen `rootDir`: dit is een npm-workspaces monorepo, dus `npm ci`/build
    # moeten vanuit de repo-root draaien zodat workspace-package @swatt/shared-types
    # correct gelinkt wordt in node_modules.
    #
    # BELANGRIJK — `--include=dev` op npm ci: Render zet NODE_ENV=production
    # (zie envVars hieronder) al actief tijdens de installstap zelf, en npm
    # slaat dan standaard alle devDependencies over — inclusief `typescript`
    # en alle `@types/*`-pakketten die we net nodig hebben om te bouwen.
    # Bevestigd via diagnostische build-log: `node_modules/@types` bestond
    # daardoor gewoon niet, en `tsc` viel terug op een andere, niet-lokale
    # versie (vandaar de eerdere, verwarrende TS5108-fout). `--include=dev`
    # forceert installatie van devDependencies ongeacht NODE_ENV.
    buildCommand: npm ci --include=dev && npm run build --workspace=packages/shared-types && npm run build --workspace=apps/api
    startCommand: npm run prisma:migrate:deploy --workspace=apps/api && npm start --workspace=apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: swatt-postgres
          property: connectionString
      - key: SESSION_COOKIE_SECRET
        generateValue: true
      - key: SEED_TOKEN
        # Geheim voor de eenmalige /admin/seed-route (zie
        # apps/api/src/modules/admin/seed.routes.ts), waarmee de allereerste
        # ADMIN-gebruiker via de browser aangemaakt kan worden. Ga na de
        # deploy naar deze envVar in het Render-dashboard om de gegenereerde
        # waarde te kopiëren.
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: CORS_ORIGINS
        # Komma-gescheiden lijst (zie apps/api/src/config/env.ts). De echte
        # productie-URL van de Vercel-deploy; latere Vercel preview-URL's
        # (per PR/branch) hier gewoon aan toevoegen, komma-gescheiden.
        # Wordt ook gebruikt als terugkeer-URL na de Teamleader OAuth-callback
        # (zie apps/api/src/modules/teamleader/teamleader.routes.ts) — dus de
        # EERSTE waarde in deze lijst moet altijd de echte frontend-URL zijn.
        value: 'https://swatt-werkbons-web.vercel.app'
      # Teamleader OAuth (Phase 2) — sync: false: deze vier moet je zelf
      # invullen in het Render-dashboard ná het registreren van de
      # Teamleader-marketplace-app (zie README "Teamleader koppelen"). Zolang
      # ze niet gezet zijn blijft de rest van de app gewoon werken; enkel de
      # /teamleader/*-routes geven dan een duidelijke "niet geconfigureerd"-fout.
      - key: TEAMLEADER_CLIENT_ID
        sync: false
      - key: TEAMLEADER_CLIENT_SECRET
        sync: false
      - key: TEAMLEADER_REDIRECT_URI
        # Moet exact overeenkomen met de redirect-URI die bij de
        # Teamleader-app geregistreerd staat, bv.
        # https://swatt-api.onrender.com/teamleader/oauth/callback
        sync: false
      - key: TEAMLEADER_TOKEN_ENCRYPTION_KEY
        # AES-256-sleutel voor de versleutelde tokenopslag (token-crypto.service.ts).
        # Render genereert deze zelf, base64-encoded — exact het formaat dat
        # config/env.ts verwacht (32 bytes na decodering).
        generateValue: true
      # Phase 9 — zie de swatt-redis Key Value-instance hierboven.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: swatt-redis
          property: connectionString

  # Phase 9 — aparte achtergrondwerker voor de Teamleader-sync (sectie 15).
  # `runtime: node` + dezelfde monorepo-buildCommand als swatt-api hierboven
  # (om exact dezelfde reden: workspace-package @swatt/shared-types moet
  # gelinkt zijn). Draait `queue/worker.ts` i.p.v. `server.ts` — geen eigen
  # HTTP-server, dus geen `healthCheckPath`.
  - type: worker
    name: swatt-sync-worker
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build --workspace=packages/shared-types && npm run build --workspace=apps/api
    startCommand: npm run start:worker --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: swatt-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: swatt-redis
          property: connectionString
      # De worker roept Teamleader rechtstreeks aan (TeamleaderAuthService/
      # TeamleaderClient, zelfde als swatt-api) — heeft dus dezelfde vier
      # TEAMLEADER_*-variabelen nodig. `sync: false`: zelfde waarden als bij
      # swatt-api hierboven handmatig invullen in het Render-dashboard (of,
      # eenvoudiger: eenmaal instellen en dan "Sync from other service"
      # gebruiken indien het dashboard dat aanbiedt).
      - key: TEAMLEADER_CLIENT_ID
        sync: false
      - key: TEAMLEADER_CLIENT_SECRET
        sync: false
      - key: TEAMLEADER_REDIRECT_URI
        sync: false
      - key: TEAMLEADER_TOKEN_ENCRYPTION_KEY
        # BELANGRIJK: dit moet EXACT dezelfde waarde zijn als bij swatt-api
        # hierboven (dezelfde versleutelde tokens in dezelfde database) —
        # `generateValue: true` zou hier een ANDERE sleutel genereren dan bij
        # swatt-api, wat de tokenopslag onleesbaar zou maken voor de worker.
        # Kopieer de gegenereerde swatt-api-waarde uit het Render-dashboard.
        sync: false
