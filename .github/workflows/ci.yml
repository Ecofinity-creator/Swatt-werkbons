name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swatt
          POSTGRES_PASSWORD: swatt_ci
          POSTGRES_DB: swatt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://swatt:swatt_ci@localhost:5432/swatt_test
      SESSION_COOKIE_SECRET: ci-test-secret-minstens-32-tekens-lang
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      - name: Prisma generate
        run: npm run prisma:generate --workspace=apps/api

      - name: Prisma migrate (test-db)
        run: npm run prisma:migrate:deploy --workspace=apps/api

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
