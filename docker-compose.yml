# Lokale ontwikkeling: Postgres + Redis. In productie draaien deze als
# managed services bij Render (zie render.yaml) — dit bestand is uitsluitend
# voor "npm run dev" op je eigen machine.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: swatt
      POSTGRES_PASSWORD: swatt_dev_local
      POSTGRES_DB: swatt_dev
    ports:
      - '5432:5432'
    volumes:
      - swatt_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  swatt_postgres_data:
